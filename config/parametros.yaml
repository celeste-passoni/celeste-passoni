# =====================================================================
# PARÂMETROS DA IA DE ATENDIMENTO — PASSONI CLINIC
# Fonte única da verdade. Tudo que a IA "sabe" sobre a clínica e como
# ela se comporta vem daqui. A base de conhecimento e os prompts são
# renderizados a partir destes valores ({{chave}}); mudar aqui = mudar
# em todas as frentes. Datas no formato AAAA-MM-DD, horas em HH:MM,
# fuso America/Sao_Paulo.
# =====================================================================

clinica:
  nome: "Passoni Clinic"
  especialidade: "ciência capilar e tricologia"
  endereco: "Av. República do Líbano, 886 – Moema, São Paulo/SP"
  referencia_endereco: "em frente ao Parque Ibirapuera"
  valet_cortesia: true
  horario_recepcao:
    dias: "segunda a sexta"
    inicio: "09:00"
    fim: "19:00"
  recesso_fim_de_ano:            # preencher a cada ano; null = sem recesso definido
    ultimo_dia_atendimento: null # ex.: "2026-12-18"
    retorno: null                # ex.: "2027-01-12"

# ---------------------------------------------------------------------
# Profissionais ofertados para PRIMEIRA CONSULTA (o que a IA vende).
# Outros médicos da clínica (retornos, procedimentos) NÃO entram aqui.
# ---------------------------------------------------------------------
consultas:
  - id: dra_luciana
    profissional: "Dra. Luciana Passoni"
    titulo: "referência em tricologia, criadora dos protocolos da clínica"
    valor: 1200.00
    valor_texto: "R$ 1.200,00"
    descricao: >-
      A consulta é iniciada pelos tricologistas, que realizam a anamnese e a
      tricoscopia. Em seguida, a Dra. Luciana faz a avaliação médica, define o
      diagnóstico e indica o tratamento personalizado.
    agenda:
      dias: "segunda a sexta"
      inicio: "12:00"
      fim: "17:00"
    agenda_texto: "de segunda a sexta-feira, das 12h às 17h"
    ofertar: true
  - id: dr_lucas
    profissional: "Dr. Lucas Vieira"
    titulo: "Coordenador Médico da Passoni Clinic e tricologista, treinado pela Dra. Luciana"
    valor: 800.00
    valor_texto: "R$ 800,00"
    descricao: >-
      Coordenador Médico da Passoni Clinic e tricologista, ele realiza toda a
      consulta, desde a avaliação clínica até o diagnóstico e a definição do
      tratamento.
    agenda:
      dias: "segunda a sexta"
      inicio: "09:00"
      fim: "17:00"
    agenda_texto: "de segunda a sexta-feira, das 9h às 17h"
    ofertar: true

consulta_inclui:
  - "avaliação médica completa e análise do histórico de saúde"
  - "exame de tricoscopia digital (não invasivo)"
  - "retorno de cortesia com a equipe de tricologistas em até {{politicas.retorno_cortesia_dias}} dias após a última sessão do tratamento, no período da manhã, sem desmarcações"
levar_no_dia: "exames realizados no último ano"

politicas:
  retorno_cortesia_dias: 30
  antecedencia_minutos: 15            # alterado em 05/10/2026 (antes 10; antes disso 30)
  consulta_parcela: false
  formas_pagamento_consulta: ["cartão de crédito", "cartão de débito", "pix", "dinheiro"]
  tratamento_parcela_max: 10          # "até 10x sem juros no cartão"
  tratamento_parcela_juros: false
  aceita_convenio: false
  emite_nota_fiscal_reembolso: true
  atendimento_online: false
  desconto_consulta: false            # valor tabelado, igual para todos
  tabela_preco_tratamento: false      # personalizado após a consulta
  referencias_investimento_tratamento: # usar só se o lead insistir; sempre como "ideia", não pacote
    - 10000
    - 12000
    - 15000
  biopsia:
    nome: "Punção Incisional Histopatológica Guiada pela Tricoscopia"
    valor: 8400.00
    parcelavel: true
  realiza_transplante: true
  atende_todas_idades: true

# ---------------------------------------------------------------------
# Persona e comportamento da IA
# ---------------------------------------------------------------------
ia:
  nome_atendente: "Celeste"
  cargo: "concierge da Passoni Clinic"
  idioma: "pt-BR"
  operacao_24_7: true                 # responde a qualquer hora
  ignorar_mensagens_antes_de: "2026-09-29"   # a Meta reentrega mensagens represadas de até 7 dias; anteriores a esta data (SP) são descartadas
  modo: "teste"                       # teste = só responde aos numeros_teste | producao = numeros_teste + leads que já receberam template da Celeste (passo > 0; 25/10/2026) | aberto = todos
                                      # em qualquer modo, quem não é respondido fica gravado no painel, sem custo
  numeros_teste: []                   # ex.: ["5511999990000"]; o painel/Firestore (config/atendimento) sobrescreve modo e lista
  numeros_teste_escrita_real: []      # subconjunto dos numeros_teste que agenda DE VERDADE no TI Saúde (os outros testes só simulam); Firestore sobrescreve
  iniciar_resgates_apenas_em_horario_comercial: true  # resgates/follow-ups só 09:00–19:00 seg–sex
  emojis_max_por_mensagem: 2
  baloes_por_resposta: { min: 1, max: 4 }
  delay_resposta_segundos:            # simula tempo humano (log-normal) — reduzido em 05/10 e 14/10 a pedido da clínica ("lead esfria"; "diminuir o tempo de resposta")
    minimo: 2
    mediana: 5
    maximo: 9
    fora_horario_comercial: { minimo: 2, mediana: 5, maximo: 9 }
  agrupamento_mensagens:              # debounce de rajadas
    espera_padrao_segundos: 2
    espera_apos_audio_segundos: 30
    espera_maxima_segundos: 90
    cancelar_e_regerar_se_chegar_nova_msg: true
  horarios:
    fonte_grade: "tisaude_horasDisponiveis"  # grade real por dia da semana vem do TI Saúde (API do Paciente, id do USUÁRIO do profissional);
                                             # as agendas em consultas[].agenda são só descrição para o lead, não a grade
    id_usuario_profissional: { dra_luciana: 29110, dr_lucas: 79786 }
    oferecer_hoje: true                      # inclui o dia atual na busca de horários (ex.: contato de manhã → consulta à tarde)
    antecedencia_minima_horas: 2             # hoje: só horários a partir de agora + N h
    dias_a_frente: 14                        # janela de busca
    opcoes_por_vez: 2                        # quantos horários a Celeste oferece de cada vez (22/10/2026: 2 do dia pedido; antes 3)
    priorizar: "mais_cedo"                   # mais_cedo | preferencia_do_lead
  follow_up_cadencia_dias: [0.2, 1, 3, 7, 15, 30, 60, 90]  # após última msg do lead
  follow_up_max_tentativas: 8
  # O número da IA é EXCLUSIVO da IA/automações: ninguém da recepção responde por ele.
  # Quando o assunto não é da IA, ela ENCAMINHA o lead ao canal humano (MarketZap) e avisa a recepção.
  recepcao:
    whatsapp: "5511916069009"                 # número da recepção (MarketZap)
    link_wa: "https://wa.me/5511916069009"
    botao_rotulo: "Falar com Recepção"       # botão de link enviado automaticamente após o encaminhamento (máx. 20 caracteres)
    botao_texto: "É só tocar no botão abaixo para falar com a nossa recepção 💙"
    # quem escreve ao número e NÃO está na base de leads recebe esta orientação (1x por conversa, sem IA, sem custo) + o botão
    orientar_nao_leads: false              # orientação AUTOMÁTICA a quem não é lead (painel sobrescreve em config/atendimento.orientar_automatico); o botão manual do painel funciona sempre
    orientacao_intervalo_horas: 24
    # 2ª mensagem automática, enviada pelo botão "Enviar aviso de recebimento" do painel (texto puro, sem botão, janela 24 h)
    aviso_recebimento_texto: "Olá! Agradecemos o seu contato 💙 Sua mensagem foi encaminhada para a nossa equipe, e em breve alguém vai falar com você por aqui.

Equipe Passoni Clinic"         # repete a orientação se a pessoa voltar a escrever depois deste intervalo
    orientacao_texto: "Olá! Agradeço o seu contato 💙 Para ser atendido pela recepção ou equipe médica, é só tocar no botão abaixo. A equipe vai te responder por lá."
    notificar_por: "whatsapp"                 # a IA (número oficial) envia template utility ao número da recepção
    template_aviso: "aviso_lead_encaminhado"  # a criar na Meta (molde: aviso_interesse_acao_recepcao)
    aviso_conteudo: ["nome do lead", "telefone (link wa.me)", "motivo", "resumo em 3 linhas", "frente"]
  encaminhar_recepcao_quando:                 # só estes 4 motivos; todo o resto a IA resolve
    - "lead já é paciente / tratamento em andamento"
    - "assunto clínico: receita, exames, medicação, efeito do tratamento"
    - "reclamação, cancelamento com reembolso"
    - "pedido explícito para falar com uma pessoa"
  nao_encaminhar:                             # a IA resolve sozinha, nunca empurra para a recepção
    - "valor da consulta, convênio, parcelamento"
    - "horário: oferece só o que existe na grade; sem encaixe"
    - "remarcar / cancelar consulta agendada pela IA"
    - "'vou pensar', 'depois', objeções"
    - "pedidos fora da política (online, desconto, tratamento sem consulta): responde a política e encerra"
  meta_taxa_encaminhamento_max: 0.05          # alerta no painel se passar

