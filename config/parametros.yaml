# ---------------------------------------------------------------------
# Campos do pré-cadastro (na ordem em que são pedidos)
# ---------------------------------------------------------------------
# Todos obrigatórios no TI Saúde (formulário "Novo Paciente"); CPF obrigatório por regra da clínica.
pre_cadastro_campos:
  - "Nome completo"                      # gravado em MAIÚSCULAS
  - "CPF"
  - "Data de nascimento"
  - "Sexo (masculino/feminino)"          # dropdown do sistema: Masculino | Feminino
  - "E-mail"
  - "Como nos conheceu?"                 # campo "Encaminhado por" — mapear para a lista abaixo
  - "CEP"                                # validado e expandido via ViaCEP → rua, bairro, cidade, UF (a API não preenche sozinha)
  - "Número da residência com o complemento"
pre_cadastro_endereco_via_cep: true      # a IA pede só CEP + número/complemento; rua/bairro/cidade/UF vêm do CEP;
                                         # se o CEP não existir, pede para conferir; se o ViaCEP estiver fora, pede o endereço completo
pre_cadastro_observacao: "dados do paciente (não do responsável). Celular = número do WhatsApp com DDD. Convênio sempre PARTICULAR (campo da API: convenio=1). Campo 'medico' (responsável) NÃO é enviado — igual à recepção."
procedimentos_permitidos:                # o agente NUNCA agenda outro procedimento além destes dois
  - { id: 264, nome: "PC - CONSULTA EQUIPE MÉDICA", idCalendario: 36, profissional: "Dr. Lucas Vieira", valor: 800 }
  - { id: 5,   nome: "PC - CONSULTA DRA. LUCIANA",   idCalendario: 1,  profissional: "Dra. Luciana Passoni", valor: 1200 }
pre_cadastro_menor_de_idade:            # se nascimento indica < 18 anos, coletar também:
  campos: ["Nome do responsável", "Parentesco (Mãe, Pai, Irmão, Irmã, Tio, Tia, Padrinho, Madrinha, Primo, Prima, Outro)", "CPF do responsável"]
encaminhado_por:                        # valores do campo "Encaminhado por" (indicado) — lista parcial; clínica vai passar a completa
  padrao_lead_ia: "CAMPANHA DE MENSAGENS"   # quando o lead veio de disparo/resgate da IA
  mapeamento:                           # o que o lead diz → valor do sistema
    "instagram da dra": "INSTAGRAM DRA. LUCIANA"
    "instagram da clínica": "INSTAGRAM PASSONI CLINIC"
    "google / pesquisa na internet": "GOOGLE"
    "tiktok": "TIK TOK"
    "mensagem / whatsapp da clínica": "CAMPANHA DE MENSAGENS"
    "indicação de pessoa": "<NOME DE QUEM INDICOU EM MAIÚSCULAS>"
    "outra clínica / médico": "<NOME DO MÉDICO>"

# ---------------------------------------------------------------------
# Resgate de Leads Perdidos — base e política (editável no painel)
# ---------------------------------------------------------------------
leads_perdidos:
  fonte:
    tabela_leads: "vertical-theory-489419-a7.gold.leads"
    tabela_status: "vertical-theory-489419-a7.gold.sistemaweb_perdidos"
    join: "nome + celular_sem_ddd = status.contato"      # como na query da clínica
  filtros:                                             # = query oficial da clínica (02/10/2026)
    janela_meses_min: 3                                # criados há MAIS de 3 meses...
    janela_meses_max: 4                                # ...e até 4 meses atrás. Quem já entrou na esteira fica até o fim do ciclo.
    agendou: "não"
    participou_acao_lead_perdidos: "não"
    dentro_2_dias_uteis: "não"
    um_por_celular_mais_recente: true
  status_da_clinica_excluidos:                         # status gravados pelas atendentes que tiram o lead da fila da IA
    - "Não quer"
  # A IA NÃO escreve nas tabelas da clínica (gold.*). O status abaixo é o dela, no CRM (Firestore),
  # inspirado na lista que a recepção usa; aparece no painel e no espelho ia_atendimento.
  status_ia:
    - "Não contatado"
    - "Template enviado (1°)"
    - "Template enviado (2°)"
    - "Em conversa"
    - "Agendado"
    - "Vamos retornar na data solicitada"
    - "Irá nos retornar"
    - "Achou caro"
    - "Quer pelo convênio"
    - "Mora em outro Estado"
    - "Mora em outro País"
    - "Está em outra clínica"
    - "Receiteiro"                                       # só quer vir pegar receita
    - "Transferido para humano"
    - "Não quer (opt-out)"
    - "Número inválido"
  recontato_por_status_ia:                               # dias até a IA voltar a abordar (null = não aborda mais)
    "Não contatado": 0
    "Template enviado (1°)": 3
    "Template enviado (2°)": 10
    "Irá nos retornar": 7
    "Vamos retornar na data solicitada": "na data"
    "Achou caro": 30
    "Quer pelo convênio": 60
    "Mora em outro Estado": 90
    "Está em outra clínica": 90
    "Mora em outro País": null
    "Receiteiro": null
    "Não quer (opt-out)": null
    "Agendado": null
    "Transferido para humano": null

# ---------------------------------------------------------------------
# Frentes de atendimento (cada uma com seu prompt)
# ---------------------------------------------------------------------
frentes:
  leads_perdidos:  { ativa: true,  prompt: "prompts/leads-perdidos-v0.md" }
  novos_leads:     { ativa: false, prompt: "prompts/novos-leads-v0.md" }
  consulta_cancelada: { ativa: false, prompt: "prompts/consulta-cancelada-v0.md" }
  inativos:        { ativa: false, prompt: "prompts/inativos-v0.md" }
  orcamento_nao_fechado: { ativa: false, prompt: "prompts/orcamento-nao-fechado-v0.md" }

# ---------------------------------------------------------------------
# Modelos de IA e preços (US$ por milhão de tokens; API Anthropic, 22/09/2026)
# ---------------------------------------------------------------------
modelos:
  conversa: "claude-opus-5"           # principal
  conversa_fallback: "claude-sonnet-5" # se o principal falhar (5xx, limite, timeout) após 1 retentativa
  auxiliar: "claude-haiku-4-5"         # resumos e classificação
  lembretes: "claude-haiku-4-5"        # lembretes de retomada (frase curta; 1/10 do custo do Opus)
  esforco: "medium"                    # low | medium | high — profundidade de raciocínio na conversa
  max_tokens_resposta: 1500
  max_chamadas_por_resposta: 8         # limite do ciclo de ferramentas por vez do lead
  precos_usd_por_milhao:
    claude-opus-5:     { entrada: 5.0,  saida: 25.0, cache_leitura: 0.5,  cache_escrita: 6.25 }
    claude-sonnet-5:   { entrada: 2.0,  saida: 10.0, cache_leitura: 0.2,  cache_escrita: 2.5 }
    claude-haiku-4-5:  { entrada: 1.0,  saida: 5.0,  cache_leitura: 0.1,  cache_escrita: 1.25 }
  cap_diario_usd: 15.0                 # ao estourar, conversas ficam pausadas com alerta

# ---------------------------------------------------------------------
# Disparos de templates (Leads Perdidos) — controlados pelo painel
# ---------------------------------------------------------------------
disparos:
  ativo: false                          # chave geral: nada sai enquanto false
  limite_diario: 100                    # templates por dia (todas as frentes)
  limite_por_execucao: 25               # por rodada do job (roda a cada 30 min no horário permitido)
  horario: { dias_uteis: true, inicio: 9, fim: 18 }   # hora local (America/Sao_Paulo)
  intervalo_entre_envios_segundos: [4, 12]            # ritmo humano entre um lead e outro
  priorizar: "mais_recentes"            # mais_recentes | mais_antigos
  templates:                            # nome na Meta (idioma pt_BR); {{1}} = primeiro nome
    T1: resgate_lembramos_de_voce
    T2: resgate_poucos_horarios
    T3: resgate_o_que_dificultou
    T4: resgate_agenda_do_mes
    T5: resgate_hoje_a_tarde
  status_apos_template: { T1: "Template enviado (1°)", T2: "Template enviado (1°)", T3: "Template enviado (2°)",
                          T4: "Template enviado (1°)", T5: "Template enviado (2°)" }
  passos:                               # sequência completa; apos_dias = dias após o passo anterior (ou após o fim do ciclo)
    - { template: T1, apos_dias: 0,  ciclo: 1 }
    - { template: T2, apos_dias: 3,  ciclo: 1 }
    - { template: T3, apos_dias: 7,  ciclo: 1 }
    - { template: T4, apos_dias: 40, ciclo: 2 }
    - { template: T5, apos_dias: 7,  ciclo: 2, so_se_horario_livre_hoje_a_tarde: true }
  reiniciar_no_passo: 3                 # após o último passo, pausa e volta ao índice 3 (T4)
  pausa_apos_ultimo_passo_dias: 90
  template_por_status:                  # recontato de quem respondeu e parou (dias em leads_perdidos.recontato_por_status_ia)
    "Irá nos retornar": T2
    "Vamos retornar na data solicitada": T2
    "Achou caro": T3
    "Quer pelo convênio": T3
    "Mora em outro Estado": T4
    "Está em outra clínica": T4

# ---------------------------------------------------------------------
# Campanhas da recepção (Inativos, Retorno, Geral) — disparos feitos pelos fluxos da clínica, NÃO pela IA
# ---------------------------------------------------------------------
campanhas:
  # Fontes: tabela automacoes.controle_envio_* + valor da coluna `acao`. Só quem recebeu disparo dessas ações é rotulado.
  # Ações antigas (ex.: inativos, inativos_2) NÃO entram. Para uma nova ação, acrescente uma linha aqui.
  fontes:
    - { tabela: controle_envio_inativos, acao: inativos_outubro, rotulo: "Inativos · outubro/2026" }
  # base fixa: sincronizar UMA vez pelo botão "Sincronizar agora" do painel (sem agendamento)
  # Conversas com frente "campanha" nunca são atendidas pela IA (em nenhum modo); a equipe direciona à recepção pelo painel.

# ---------------------------------------------------------------------
# Lembretes de retomada (a Celeste chama de volta quem ela escreveu e não respondeu)
# ---------------------------------------------------------------------
lembretes:
  ativo: true
  horas: [10, 12, 14, 16, 18]          # Cloud Scheduler roda nesses horários (America/Sao_Paulo)
  dias_uteis: true
  minimo_sem_resposta_min: 60          # só depois de 1 h sem resposta
  max_por_conversa: 3
  so_dentro_janela_24h: true           # texto livre só até 24 h da última msg do lead; depois, template (futuro)
