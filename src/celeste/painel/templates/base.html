<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}CRM{% endblock %} · {{ nome_ia }}</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{--navy:#12152B;--navy2:#1b1f3a;--bege:#EFE6D8;--champ:#D9C7A5;--ouro:#B89B5E;--fundo:#F7F3EC;--texto:#1c1c1c;--cinza:#6b6b6b;--linha:#e3dccd;--ok:#2f7d4f;--alerta:#b8532a;--card:#fff;--menu:230px}
*{box-sizing:border-box}body{margin:0;font-family:Montserrat,system-ui,sans-serif;background:var(--fundo);color:var(--texto);font-size:14px}
aside{position:fixed;left:0;top:0;bottom:0;width:var(--menu);background:var(--navy);color:var(--bege);display:flex;flex-direction:column;padding:18px 0}
aside .marca{font-family:'Playfair Display',serif;font-size:20px;padding:4px 22px 18px;letter-spacing:.4px}aside .marca b{color:var(--champ)}aside .marca small{display:block;font-family:Montserrat;font-size:11px;opacity:.7;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
aside nav a{display:flex;align-items:center;gap:10px;color:var(--bege);text-decoration:none;padding:11px 22px;opacity:.78;font-weight:500;border-left:3px solid transparent}
aside nav a:hover{opacity:1;background:var(--navy2)}aside nav a.ativo{opacity:1;background:var(--navy2);border-left-color:var(--champ);color:#fff}
aside nav a .ic{width:20px;text-align:center;opacity:.9}aside .rodape{margin-top:auto;padding:14px 22px;font-size:11px;opacity:.55}
main{margin-left:var(--menu);padding:24px 28px;max-width:1400px}
@media(max-width:860px){aside{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:8px}aside .marca{padding:6px 12px}aside nav{display:flex;flex-wrap:wrap}aside nav a{padding:8px 12px;border-left:0}aside .rodape{display:none}main{margin-left:0;padding:16px}}
h1{font-family:'Playfair Display',serif;font-weight:600;font-size:24px;margin:0 0 16px}h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--cinza);margin:26px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:14px 16px}.card .n{font-size:26px;font-weight:700;color:var(--navy)}.card .l{color:var(--cinza);font-size:12px;margin-top:2px}
.frente,.bloco{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:16px}.frente h3,.bloco h3{margin:0 0 10px;font-size:16px;color:var(--navy)}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.duas{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--linha);border-radius:10px;overflow:hidden}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--linha);vertical-align:top}th{background:var(--bege);font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}tr:last-child td{border-bottom:0}
table.funil td.num{text-align:right;font-variant-numeric:tabular-nums}table.funil tr.ef td{color:var(--alerta);background:#f6f1ea}table.funil tr.total td{background:var(--navy);color:var(--bege);font-weight:600}table.funil td.rot{font-weight:500}
a{color:var(--navy)}.tag{display:inline-block;padding:2px 8px;border-radius:12px;background:var(--bege);font-size:12px;color:var(--navy)}
.tag.ok{background:#dff0e5;color:var(--ok)}.tag.alerta{background:#f8e3d8;color:var(--alerta)}.tag.lp{background:var(--navy);color:var(--champ)}.tag.nl{background:var(--champ);color:var(--navy)}
form.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input[type=number],input[type=text],input[type=date],select{padding:6px 8px;border:1px solid var(--linha);border-radius:6px;font-family:inherit}
button,.btn{background:var(--navy);color:var(--bege);border:0;border-radius:6px;padding:7px 14px;font-family:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}button.leve,.btn.leve{background:var(--bege);color:var(--navy)}
.chat{display:flex;flex-direction:column;gap:6px;max-width:720px}.balao{padding:10px 14px;border-radius:14px;max-width:80%;white-space:pre-wrap;line-height:1.4}
.balao.lead{background:#fff;border:1px solid var(--linha);align-self:flex-start}.balao.celeste,.balao.humano{background:var(--navy);color:var(--bege);align-self:flex-end}.balao.template{background:var(--champ);color:var(--navy);align-self:flex-end;font-style:italic}
.balao .meta{font-size:11px;opacity:.7;margin-top:4px}.muted{color:var(--cinza)}
.aviso{background:#fff8e6;border:1px solid #e8d9a8;padding:10px 14px;border-radius:8px;margin-bottom:14px}
.atalhos a{margin-right:10px;font-size:12px}.pag a{margin:0 4px}
.doc{background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:24px 32px;max-width:900px;line-height:1.55}.doc h1,.doc h2,.doc h3{font-family:Montserrat;color:var(--navy)}.doc h2{text-transform:none;letter-spacing:0;font-size:18px;margin-top:26px}.doc table{margin:10px 0}.doc code{background:var(--bege);padding:1px 5px;border-radius:4px;font-size:12px}.doc blockquote{border-left:3px solid var(--champ);margin:10px 0;padding:4px 14px;color:#444}
</style>
{% block head %}{% endblock %}
</head>
<body>
<aside>
  <div class="marca">Passoni <b>· {{ nome_ia }}</b><small>CRM</small></div>
  {% set p = request.url.path %}
  <nav>
    <a href="/" class="{% if p == '/' %}ativo{% endif %}"><span class="ic">▦</span> Gestão e Performance</a>
    <a href="/atendimentos" class="{% if p.startswith('/atendimentos') or p.startswith('/conversas') or p.startswith('/encaminhamentos') %}ativo{% endif %}"><span class="ic">💬</span> Atendimentos</a>
    <a href="/funil" class="{% if p.startswith('/funil') %}ativo{% endif %}"><span class="ic">▽</span> Funil</a>
    <a href="/listas" class="{% if p.startswith('/listas') %}ativo{% endif %}"><span class="ic">☰</span> Listas</a>
    <a href="/frentes" class="{% if p.startswith('/frentes') %}ativo{% endif %}"><span class="ic">◈</span> Frentes de Trabalho</a>
    <a href="/templates" class="{% if p.startswith('/templates') %}ativo{% endif %}"><span class="ic">▤</span> Templates</a>
  </nav>
  <div class="rodape">Passoni Clinic · atendimento por IA<br><span style="opacity:.9">WhatsApp da {{ nome_ia }}: {{ numero_ia }}</span></div>
</aside>
<main>{% block corpo %}{% endblock %}</main>
</body>
</html>
